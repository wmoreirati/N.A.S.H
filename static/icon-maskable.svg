<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="N.A.S.H">
  <!-- Maskable: o desenho fica dentro da zona segura (80% central), porque o
       Android recorta o icone em formatos diferentes conforme o aparelho. -->
  <rect width="512" height="512" fill="#05080d"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#1d4fb8" stroke-width="8" opacity="0.75"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#2f6fed" stroke-width="7" stroke-dasharray="16 13"/>
  <circle cx="256" cy="256" r="47" fill="url(#nucleoM)"/>
  <defs>
    <radialGradient id="nucleoM" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8fc0ff"/>
      <stop offset="62%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#1d4fb8"/>
    </radialGradient>
  </defs>
</svg>
