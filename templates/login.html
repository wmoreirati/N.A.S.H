<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="N.A.S.H — acesso restrito.">
<meta name="robots" content="noindex, nofollow">
<title>N.A.S.H — Acesso</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='acesso.css') }}">
</head>
<body>

<main class="porta">
  <section class="cartao">

    <div class="marca">
      <div class="marca-simbolo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>
        </svg>
      </div>
      <div class="marca-nome">N.A.S.H</div>
      <div class="marca-sub">Acesso restrito</div>
    </div>

    <div class="abas" role="tablist">
      <button class="aba" id="aba-entrar" role="tab" aria-selected="true"
              aria-controls="form-entrar">Entrar</button>
      <button class="aba" id="aba-pedir" role="tab" aria-selected="false"
              aria-controls="form-pedir">Pedir acesso</button>
    </div>

    <form id="form-entrar" novalidate>
      <div class="campo">
        <label for="entrar-email">E-mail</label>
        <input type="email" id="entrar-email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="entrar-senha">Senha</label>
        <input type="password" id="entrar-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="enviar">Entrar</button>
      <div class="linha-elo">
        <button type="button" class="elo" id="abrir-esqueci">Esqueci minha senha</button>
      </div>
    </form>

    <form id="form-esqueci" novalidate hidden>
      <div class="campo">
        <label for="esqueci-email">Seu e-mail</label>
        <input type="email" id="esqueci-email" autocomplete="email" required>
        <p class="ajuda">Enviamos um link para você criar uma nova senha.</p>
      </div>
      <button type="submit" class="enviar">Enviar link</button>
      <div class="linha-elo">
        <button type="button" class="elo" id="voltar-entrar">Voltar para o login</button>
      </div>
    </form>

    <form id="form-pedir" novalidate hidden>
      <div class="campo">
        <label for="pedir-nome">Nome</label>
        <input type="text" id="pedir-nome" autocomplete="name">
      </div>
      <div class="campo">
        <label for="pedir-email">E-mail</label>
        <input type="email" id="pedir-email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="pedir-senha">Senha (mínimo 8 caracteres)</label>
        <input type="password" id="pedir-senha" autocomplete="new-password"
               minlength="8" required>
      </div>
      <button type="submit" class="enviar">Enviar pedido</button>
    </form>

    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <p class="nota">
      O acesso é liberado manualmente pelo administrador.<br>
      Você poderá entrar assim que seu pedido for aprovado.
    </p>

  </section>
</main>

<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
